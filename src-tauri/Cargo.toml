[package]
name = "pdf_lite"
version = "0.1.0"
description = "PDF Lite desktop app"
authors = ["pdf_lite"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
flate2 = "1"
rayon = "1"
