[package]
name = "file_lite"
version = "0.2.0"
description = "File Lite - PDF, Image & Video compression"
authors = ["file_lite"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
flate2 = "1"
rayon = "1"
oxipng = "9"
imagequant = "4"
rgb = "0.8"
webp = "0.3"
resvg = "0.44"
png = "0.18"
